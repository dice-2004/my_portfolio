services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      network: host
    container_name: portfolio-backend
    ports:
      - "8031:8080"
    volumes:
      - ./backend:/app
      # - /srv/portfolio-vault:/vault:ro   # Obsidian を使うとき。手順は docs/obsidian-sync.md
    environment:
      - PORT=8080
      - DB_PATH=/app/data/portfolio.db
      - GIN_MODE=release
      # AI チャット。キーはリポジトリ直下の .env（.env.example をコピー、git 管理外）に書く。無ければチャットは無効
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHAT_DAILY_LIMIT=${CHAT_DAILY_LIMIT:-400}
      # Obsidian のノートも材料にするとき。Vault を下の volumes でマウントし、そのパスを書く
      # （Vault 内に obsidianignore（.md 付きでも可）が 1 つも無いと、安全のため読み込まない）
      - OBSIDIAN_VAULT=${OBSIDIAN_VAULT_IN_CONTAINER:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      network: host
    container_name: portfolio-frontend
    ports:
      - "3031:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://portfolio.dice-ke.tech
    #=========================================================
    # 【起動モードの切り替え】
    # 開発用 (Hot Reload有効):   command: npm run dev
    # 本番用 (Build & Start):   command: sh -c "npm install --include=dev && npm run build && npm run start"
    # ※ 本番用の場合は下の行のコメントアウトを外し、上の行を隠してください
    #=========================================================
    # command: npm run dev
    command: sh -c "npm install --include=dev && npm run build && npm run start"
    depends_on:
      backend:
        condition: service_healthy
