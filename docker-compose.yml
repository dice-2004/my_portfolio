version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      network: host
    container_name: portfolio-backend
    ports:
      - "8031:8080"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8080
      - DB_PATH=/app/data/portfolio.db

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      network: host
    container_name: portfolio-frontend
    ports:
      - "3031:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8031
    #=========================================================
    # 【起動モードの切り替え】
    # 開発用 (Hot Reload有効):   command: npm run dev
    # 本番用 (Build & Start):   command: sh -c "npm install && npm run build && npm run start"
    # ※ 本番用の場合は下の行のコメントアウトを外し、上の行を隠してください
    #=========================================================
    # command: npm run dev
    command: sh -c "npm install && npm run build && npm run start"
    depends_on:
      - backend
